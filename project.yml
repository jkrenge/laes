name: Laes
options:
  bundleIdPrefix: app.laes
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # A stable signature, so the Keychain recognises the app across rebuilds (ad-hoc signing re-prompts every build).
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: W7QGTVUD84
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
packages:
  # Crash reports, usage counts and feedback, sent to lães's own Cloudflare Worker.
  BoringKit:
    url: https://github.com/jkrenge/boring-ass-app-kit
    minorVersion: 0.2.1
targets:
  Laes:
    type: application
    platform: macOS
    sources: [Laes]
    dependencies:
      - package: BoringKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.laes.Laes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "lães"
        INFOPLIST_KEY_CFBundleName: "lães"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # only Apple's HTTPS, as on the iPhone
    # The Mac App Store needs the sandbox: Microsoft over the network, and the AI connection listening on 127.0.0.1.
    entitlements:
      path: Laes/Laes.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    scheme:
      testTargets: [LaesTests]
  LaesiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # The Mac app's code minus its window shell; LaesiOS holds the touch screens.
      - path: Laes
        excludes: [LaesApp.swift, MCPServer.swift, Assets.xcassets, Views/ContentView.swift, Views/WelcomeView.swift, Laes.entitlements, container-migration.plist]
      - LaesiOS
    dependencies:
      - package: BoringKit
    info:
      path: LaesiOS/Info.plist
      properties:
        CFBundleName: lães   # iOS prompts (sign-in, notifications) show this one, not the display name
        CFBundleDisplayName: lães
        CFBundleShortVersionString: $(MARKETING_VERSION)   # one version for iPhone and Mac
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.laes.Laes.refresh]
        ITSAppUsesNonExemptEncryption: false   # only Apple's HTTPS, so uploads skip the export-compliance question
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.laes.Laes
        CODE_SIGN_STYLE: Automatic
        # The App Icon settings' other designs (AppIcon-*), drawn by Scripts/make-icon.swift.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "lães"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  LaesTests:
    type: bundle.unit-test
    platform: macOS
    sources: [LaesTests]
    dependencies:
      - target: Laes
